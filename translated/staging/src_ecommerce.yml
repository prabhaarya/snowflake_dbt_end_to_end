version: 2

sources:
  - name: raw_ecommerce
    # Update database (GCP Project) and schema (BigQuery Dataset) for your target environment
    database: "{{ env_var('DBT_BQ_PROJECT', 'prabha-test') }}"
    schema: "{{ env_var('DBT_BQ_DATASET', 'raw_ecommerce') }}"
    tables:
      - name: raw_customers
        description: "Raw customer registration records."
        columns:
          - name: id
            tests:
              - unique
              - not_null
      - name: raw_orders
        description: "Raw customer orders."
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: customer_id
            tests:
              - not_null
              - relationships:
                  to: source('raw_ecommerce', 'raw_customers')
                  field: id
